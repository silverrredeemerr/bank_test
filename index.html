<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tatra banka</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone-frame">
        <header class="app-header">
            <div class="header-content">
                <div class="bank-logo">Tatra banka</div>
                <div class="header-right">
                    <span id="time" class="time"></span>
                    <button class="edit-btn">Upraviť</button>
                    <div class="profile-pic">👤</div>
                </div>
            </div>
        </header>

        <main class="main-content">
            <!-- Баланс -->
            <div class="balance-card">
                <div class="balance-header">
                    <span class="balance-label">Celkový zostatok</span>
                    <button id="toggle-balance" class="toggle-btn">👁️</button>
                </div>
                <div class="balance-amount" id="balance-amount">12 458,76 €</div>
                <div class="balance-change positive">+ 248,50 € (+2,04 %) tento mesiac</div>

                <div class="quick-actions">
                    <button class="quick-btn" onclick="changeBalance(100)">+100 €</button>
                    <button class="quick-btn" onclick="changeBalance(-100)">-100 €</button>
                    <button class="quick-btn" onclick="randomBalance()">🎲 Náhodný</button>
                </div>
            </div>

            <!-- Рахунки -->
            <div class="section">
                <h3>Moje účty</h3>
                <div class="account-item">
                    <div class="account-info">
                        <strong>Bieżący účet</strong><br>
                        <small>SK12 1100 0000 1234 5678 9012</small>
                    </div>
                    <div class="account-balance" id="main-account">12 458,76 €</div>
                </div>
            </div>

            <!-- Останні операції -->
            <div class="section">
                <div class="section-header">
                    <h3>Posledné pohyby</h3>
                    <a href="#" class="see-all">Všetky</a>
                </div>
                <div id="transactions-list" class="transactions"></div>
            </div>
        </main>

        <nav class="bottom-nav">
            <div class="nav-item active"><span class="nav-icon">🏠</span><span>Domov</span></div>
            <div class="nav-item"><span class="nav-icon">💸</span><span>Platby</span></div>
            <div class="nav-item"><span class="nav-icon">📊</span><span>Prehľady</span></div>
            <div class="nav-item"><span class="nav-icon">👤</span><span>Ja</span></div>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
