<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tatra banka</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone-frame">
        <!-- Status bar -->
        <div class="status-bar">
            <span id="time">10:37</span>
            <div class="right-info">5G • 87%</div>
        </div>

        <header class="app-header">
            <div class="header-top">
                <div class="user-info">
                    <div class="avatar">P</div>
                    <div>
                        <strong>P. Ivan</strong><br>
                        <small>Privátny banking</small>
                    </div>
                </div>
                <button class="upravit-btn">Upraviť</button>
            </div>
        </header>

        <main class="main-content">
            <!-- Účty -->
            <div class="section">
                <div class="section-header">
                    <h3>Účty</h3>
                    <span class="see-all">Zobraziť všetko</span>
                </div>
                <div class="account-card">
                    <div class="account-info">
                        <strong>Demo účet</strong><br>
                        <small>SK12 1100 0000 0008 1234 5678</small>
                    </div>
                    <div class="account-balance" id="main-balance">502,00 €</div>
                    <div class="graph-placeholder">📈</div>
                </div>
            </div>

            <!-- Karty -->
            <div class="section">
                <div class="section-header">
                    <h3>Karty</h3>
                    <span class="see-all">Zobraziť všetky</span>
                </div>
                <div class="card-visual">
                    <div class="visa-card">
                        <div class="card-logo">VISA</div>
                        <div class="card-number">•••• •••• •••• 4242</div>
                        <div class="card-holder">P. IVAN</div>
                    </div>
                </div>
                <div class="credit-card-info">
                    <strong>Moja kreditná karta</strong><br>
                    <small>•••• 1234</small>
                    <div class="credit-balance" id="credit-balance">4 950,00 €</div>
                </div>
            </div>
        </main>

        <nav class="bottom-nav">
            <div class="nav-item active"><span class="nav-icon">🏠</span><span>Domov</span></div>
            <div class="nav-item"><span class="nav-icon">💸</span><span>Platby</span></div>
            <div class="nav-item"><span class="nav-icon">📊</span><span>Prehľady</span></div>
            <div class="nav-item"><span class="nav-icon">👤</span><span>Ja</span></div>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
